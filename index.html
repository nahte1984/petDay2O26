<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奧美非人類日大投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     視覺語言來自 Figma「petDay」154:2
       底色 #00beff ／ 主紅 #fa0044 ／ 亮黃 #ffec00 ／ 標題字 IBM Plex Sans JP Bold
     首頁是一張等比縮放的海報，登入與投票頁沿用同一套顏色與字體。
     ================================================================ */
  :root {
    --cyan: #00beff;
    --red: #fa0044;
    --yellow: #ffec00;
    --ink: #111114;
    --white: #fff;
    --muted: #5c6970;
    --line: #111114;
    --radius: 12px;
    --display: "IBM Plex Sans JP", "PingFang TC", "Noto Sans TC",
               "Microsoft JhengHei", sans-serif;
    --body: "Helvetica Neue", "PingFang TC", "Noto Sans TC",
            "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cyan);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px 80px; }

  /* ================= 首頁海報 ================= */
  /* 舞台鎖定 420×812 的比例，同時受寬度與高度限制，所以永遠整張看得到、不用捲動。
     內部元素全部用百分比定位，字級用 cqw（100cqw = 舞台寬），等比例縮放。 */
  #landingView {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: min(420px, 100vw, 51.724vh);
    width: min(420px, 100vw, 51.724dvh);
    aspect-ratio: 420 / 812;
    container-type: inline-size;
  }
  .stage img { position: absolute; object-fit: contain; }

  .st-logo  { left: 2.381%;  top: 1.232%;  width: 23.810%; height: 7.019%; }
  .st-fei   { left: 2.381%;  top: 36.95%;  width: 23.810%; height: 10.17%; }
  .st-ren   { left: 26.190%; top: 28.571%; width: 23.810%; height: 12.438%; }
  .st-lei   { left: 50%;     top: 30.296%; width: 23.810%; height: 6.527%; }
  .st-ri    { left: 73.810%; top: 34.113%; width: 23.810%; height: 13.670%; }
  .st-word1 { left: 2.381%;  top: 44.951%; width: 95.238%; height: 6.281%; }
  .st-word2 { left: 2.381%;  top: 52.340%; width: 95.238%; height: 6.527%; }

  .st-sub {
    position: absolute;
    top: 61.576%;
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: 6.667cqw;
    line-height: 1;
    color: var(--red);
    letter-spacing: 2cqw;
    white-space: nowrap;
    /* 黃色描邊。paint-order 讓描邊畫在填色「後面」，
       所以黃邊長在紅字外圍，而不是往內吃掉紅色。 */
    -webkit-text-stroke: 0.476cqw var(--yellow);
    paint-order: stroke fill;
  }
  .st-sub.left  { left: 2.381%; }
  /* letter-spacing 會在最後一字後面多留一格，右對齊時要補回來 */
  .st-sub.right { right: 2.381%; margin-right: -2cqw; }

  .st-cta {
    position: absolute;
    left: 25%; top: 71.921%;
    width: 50%; height: 7.882%;
    display: flex; align-items: center; justify-content: center;
    background: var(--red);
    border: 0.476cqw solid var(--yellow);
    border-radius: 3.571cqw;
    font-family: var(--display);
    font-weight: 700;
    font-size: 9.048cqw;
    letter-spacing: 2.714cqw;
    text-indent: 2.714cqw;      /* 同上，讓置中真的置中 */
    /* 視覺微調：字體的中文字面偏上，往下推 1px 看起來才是置中。
       嫌多／嫌少就改這個值（0.238cqw ≈ 1px）。 */
    --cta-nudge: 0.238cqw;
    color: var(--white);
    cursor: pointer;
    padding: 0;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .st-cta span { display: inline-block; transform: translateY(var(--cta-nudge)); }
  .st-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
  .st-cta:active { transform: translateY(1px); box-shadow: none; }

  /* 不支援 container query 的舊瀏覽器：退回設計稿的固定字級 */
  @supports not (container-type: inline-size) {
    .st-sub { font-size: 28px; letter-spacing: 8.4px; -webkit-text-stroke-width: 2px; }
    .st-sub.right { margin-right: -8.4px; }
    .st-cta { font-size: 38px; letter-spacing: 11.4px; text-indent: 11.4px;
              border-width: 2px; border-radius: 15px; --cta-nudge: 1px; }
  }

  /* ================= 通用元件 ================= */
  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: 30px; letter-spacing: .02em; margin: 0 0 6px; color: var(--red);
  }
  h2 {
    font-family: var(--display); font-weight: 700;
    font-size: 19px; margin: 0 0 14px;
  }
  .sub { color: var(--ink); font-size: 14px; margin: 0 0 24px; opacity: .8; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 0 0 6px; }
  input[type=text], input[type=password], input[type=tel], select {
    width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
    border: 2px solid var(--ink); border-radius: 10px;
    background: var(--white); color: var(--ink); outline: none;
    transition: box-shadow .12s ease;
  }
  input:focus, select:focus { box-shadow: 0 0 0 4px var(--yellow); }
  .field { margin-bottom: 16px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  button {
    font-family: var(--body); font-size: 15px; font-weight: 700;
    border-radius: 10px; border: 2px solid var(--ink);
    padding: 11px 18px; cursor: pointer;
    background: var(--ink); color: var(--white);
    transition: transform .1s ease, background .12s ease, color .12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.ghost { background: var(--white); color: var(--ink); }
  button.primary { background: var(--red); border-color: var(--yellow); }
  button.small { padding: 8px 13px; font-size: 13px; }
  button.block { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .msg {
    padding: 11px 14px; border-radius: 10px; font-size: 14px;
    margin: 14px 0; display: none; border: 2px solid var(--ink); font-weight: 600;
  }
  .msg.show { display: block; }
  .msg.err { background: var(--red); color: var(--white); border-color: var(--ink); }
  .msg.ok  { background: var(--yellow); color: var(--ink); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ================= 登入 ================= */
  #loginView { display: none; max-width: 400px; margin: 0 auto; padding-top: 8vh; }
  #loginView .card-box {
    background: var(--white); border: 3px solid var(--ink);
    border-radius: 18px; padding: 26px 22px;
  }
  .brand { width: 96px; height: auto; display: block; margin-bottom: 18px; }
  #whoPicker { display: none; }

  /* ================= App 外框 ================= */
  #appView { display: none; }
  header.bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--cyan);
    border-bottom: 3px solid var(--ink);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; margin-bottom: 18px;
  }
  header.bar .brand { width: 62px; margin: 0; }
  .bar .title {
    font-family: var(--display); font-weight: 700;
    font-size: 17px; letter-spacing: .08em;
  }
  .bar .me { font-size: 13px; margin-left: auto; font-weight: 600; }
  .tabs { display: flex; gap: 8px; margin: 0 0 20px; }
  .tabs button {
    flex: 1; background: var(--white); color: var(--ink);
    font-family: var(--display); letter-spacing: .06em;
  }
  .tabs button.on {
    background: var(--red); color: var(--white); border-color: var(--yellow);
  }
  .panel { display: none; }
  .panel.on { display: block; }
  #listSummary {
    background: var(--white); border: 2px solid var(--ink); border-radius: 10px;
    padding: 9px 13px; font-size: 13px; font-weight: 600; opacity: 1;
  }

  /* ================= 候選卡 ================= */
  .card {
    background: var(--white); border: 2px solid var(--ink);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 12px;
    display: flex;
  }
  .card .thumb {
    width: 112px; min-width: 112px; background: var(--cyan);
    background-size: cover; background-position: center;
    border-right: 2px solid var(--ink);
  }
  .card .body { padding: 12px 14px; flex: 1; min-width: 0; }
  .card .target {
    font-family: var(--display); font-weight: 700;
    font-size: 17px; letter-spacing: .01em;
  }
  .card .animal { font-size: 14px; margin-top: 1px; }
  .card .animal b { color: var(--red); }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card .foot { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .count {
    font-family: var(--display); font-weight: 700;
    font-size: 24px; color: var(--red); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .count span { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .rank {
    position: absolute; margin: 8px;
    background: var(--yellow); color: var(--ink);
    font-family: var(--display); font-weight: 700;
    font-size: 11px; padding: 3px 8px; border-radius: 20px;
    border: 2px solid var(--ink);
  }
  .empty {
    text-align: center; font-size: 14px; font-weight: 600;
    padding: 46px 20px; border: 3px dashed var(--ink); border-radius: var(--radius);
    background: rgba(255,255,255,.5);
  }

  /* ================= 提名表單 ================= */
  #tab-new { background: var(--white); border: 3px solid var(--ink);
             border-radius: 18px; padding: 20px 18px; }
  #tab-new.panel { display: none; }
  #tab-new.panel.on { display: block; }
  .preview {
    display: none; margin-top: 14px; border: 2px solid var(--ink);
    border-radius: var(--radius); overflow: hidden; background: var(--white);
  }
  .preview.show { display: block; }
  .preview img { width: 100%; display: block; max-height: 320px; object-fit: cover;
                 border-bottom: 2px solid var(--ink); }
  .preview .pfoot {
    padding: 9px 12px; display: flex; align-items: center;
    gap: 10px; font-size: 12px; color: var(--muted);
  }
  .upload-btn {
    display: inline-block; padding: 11px 18px; font-size: 15px; font-weight: 700;
    border: 2px solid var(--ink); border-radius: 10px; cursor: pointer;
    background: var(--yellow);
  }
  input[type=file] { display: none; }
  .divider {
    text-align: center; font-size: 12px; color: var(--muted);
    margin: 16px 0; position: relative;
  }
  .divider::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 2px solid var(--line); opacity: .25; z-index: 0;
  }
  .divider span { background: var(--white); padding: 0 12px; position: relative; }

  /* 致命錯誤橫幅：程式整段掛掉時唯一還會出現的東西 */
  #fatal {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999;
    background: var(--ink); color: var(--yellow); padding: 12px 16px;
    font-size: 13px; line-height: 1.5; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>

<!-- ==================== 首頁海報 ====================
     版面來自 Figma petDay 154:2。舞台固定 420×812 比例、等比縮放，
     所以在任何螢幕上都是完整一張，不會被裁掉也不用捲動。 -->
<div id="landingView">
  <div class="stage">

<!-- 攔截 module 載入／解析錯誤。module 內部的 SyntaxError 沒辦法用 try/catch 抓，
     只能靠這支傳統 script 在外面聽，不然畫面會完全沒反應、也不知道錯在哪。 -->
<div id="fatal"></div>
<script>
  // 程式成功啟動後會被設成 true，用來分辨「載入失敗」與「執行中出錯」——
  // 兩者的嚴重性差很多，訊息寫一樣只會誤導人。
  window.__booted = false;

  function showFatal(text) {
    var el = document.getElementById('fatal');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = (window.__booted ? '發生錯誤：' : '程式載入失敗：') + text;
    // 已經正常啟動後的零星錯誤不該一直佔著畫面，8 秒後自動收起
    if (window.__booted) {
      clearTimeout(el.__t);
      el.__t = setTimeout(function () { el.style.display = 'none'; }, 8000);
    }
  }

  window.addEventListener('error', function (e) {
    var where = e.filename ? ' （' + e.filename.split('/').pop() +
                (e.lineno ? ':' + e.lineno : '') + '）' : '';
    showFatal((e.message || '未知錯誤') + where);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatal(String(e.reason && (e.reason.code || e.reason.message) || e.reason));
  });
</script>

<script type="module">
// 用命名空間匯入，這樣 config.js 不管寫 FIREBASE_CONFIG 還是 firebaseConfig 都能用。
// （從 Firebase Console 複製貼上時很容易把名稱換掉，之前就是這樣壞的。）
import * as CFG from './config.js';
import { localTranslate, normalizeAnimal } from './animals.js';

const FIREBASE_CONFIG = CFG.FIREBASE_CONFIG || CFG.firebaseConfig || CFG.default;
const PEXELS_API_KEY = CFG.PEXELS_API_KEY || CFG.pexelsApiKey || 'PASTE_';
const EVENT = Object.assign({
  title: '奧美非人類日大投票',
  subtitle: '人類們請先登入',
  maxVotesPerDay: 10,
  maxNominationsPerDay: 3,
  votingOpen: true,
}, CFG.EVENT || {});

// 舊版設定用的是「總額度」欄位名，還沒改 config.js 也不會壞
const MAX_VOTES = EVENT.maxVotesPerDay ?? EVENT.maxVotesPerUser ?? 10;
const MAX_NOMS = EVENT.maxNominationsPerDay ?? EVENT.maxNominationsPerUser ?? 3;

// ---------- 每日額度的「今天」 ----------
// 用台北時間（UTC+8）算，不管使用者的裝置時區設成哪裡都一樣，
// 而且與 firestore.rules 裡的算法一致（規則會拒絕對不上的日期）。
// 格式是整數 YYYYMMDD，比字串好比較也好排序。
function taipeiDayInt(d = new Date()) {
  const t = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000);
  return t.getFullYear() * 10000 + (t.getMonth() + 1) * 100 + t.getDate();
}

// 距離台北時間下一個 0:00 還有多久
function msUntilReset(d = new Date()) {
  const t = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000);
  const next = new Date(t);
  next.setHours(24, 0, 0, 0);
  return next - t;
}

function resetCountdown() {
  const ms = msUntilReset();
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? `${h} 小時 ${m} 分後重置` : `${m} 分後重置`;
}

let TODAY = taipeiDayInt();

if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) {
  const el = document.getElementById('fatal');
  el.style.display = 'block';
  el.textContent = 'config.js 裡找不到 Firebase 設定。請確認有 export firebaseConfig（或 FIREBASE_CONFIG）。';
  throw new Error('missing firebase config');
}

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, collection, doc, getDoc, setDoc, deleteDoc,
  onSnapshot, query, where, orderBy, runTransaction, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const show = (el, text, kind) => {
  el.textContent = text;
  el.className = `msg show ${kind || ''}`;
};
const hide = (el) => { el.className = 'msg'; };

// ==================== 員工名單 ====================
let ROSTER = [];
let BY_ID = new Map();

async function loadRoster() {
  const res = await fetch('./roster.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('讀不到員工名單 roster.json');
  const data = await res.json();
  ROSTER = data.people;
  BY_ID = new Map(ROSTER.map((p) => [String(p.id), p]));

  // 兩個 datalist 都填上名單（登入用、提名用）
  const opts = ROSTER.map((p) => {
    const o = document.createElement('option');
    o.value = p.name;
    o.label = p.dept;
    return o;
  });
  $('nameList').append(...opts.map((o) => o.cloneNode(true)));
  $('nameList2').append(...opts);
}

// 把使用者輸入（分機或姓名）解析成候選員工清單
function resolveWho(input) {
  const q = String(input || '').trim();
  if (!q) return [];

  // 純數字 → 當成分機
  if (/^\d{1,4}$/.test(q)) {
    const ext = q.padStart(3, '0');
    return ROSTER.filter((p) => p.ext === ext);
  }

  const lower = q.toLowerCase();
  const exact = ROSTER.filter((p) => p.name.toLowerCase() === lower);
  if (exact.length) return exact;

  // 部分比對：「Abby」也能找到「AbbyKM Ku」
  const loose = ROSTER.filter((p) => {
    const n = p.name.toLowerCase();
    return n.includes(lower) || n.replace(/[^a-z]/g, '').includes(lower.replace(/[^a-z]/g, ''));
  });
  return loose;
}

    let text;

      text = '身分證後 4 碼不正確。（若是所有人都登不進去，可能是還沒執行建帳號腳本）';
    } else if (code.includes('user-not-found')) {
      text = `找不到 ${person.name} 的帳號，請先執行 node seed-users.mjs --commit 建立員工帳號。`;
    } else if (code.includes('operation-not-allowed')) {
      text = 'Firebase 尚未啟用「電子郵件/密碼」登入方式，請到 Authentication → Sign-in method 開啟。';
    } else if (code.includes('configuration-not-found')) {
      text = 'Firebase 專案還沒啟用 Authentication，請到 Console 的 Authentication 頁面按「開始使用」。';
    } else if (code.includes('unauthorized-domain')) {
      text = '這個網域未被授權，請到 Authentication → Settings → 已授權網域，加入 nahte1984.github.io。';
    } else if (code.includes('api-key-not-valid') || code.includes('invalid-api-key')) {
      text = 'config.js 的 apiKey 不正確，請重新從 Firebase Console 複製。';
    } else if (code.includes('too-many-requests')) {
      text = '嘗試次數過多，請等幾分鐘再試。';
    } else if (code.includes('network')) {
      text = '網路連線有問題，請檢查後再試。';

// ==================== 候選列表與投票 ====================
let CANDIDATES = [];
let MY_VOTES = [];          // 我投過的每一票 { candidateId, day }，可重複投同一人
let dayWatcher = null;

const usedToday = () => MY_VOTES.filter((v) => v.day === TODAY).length;
const myVotesFor = (id) => MY_VOTES.filter((v) => v.candidateId === id).length;

// 登出時務必把三樣東西都收掉：兩個 Firestore 監聽 + 每 30 秒的換日計時器。
// 之前只收了監聽，計時器留著繼續呼叫 render()，而 render() 會用到已經變成
// null 的 ME，於是每 30 秒就噴一次 TypeError。
function stopListening() {
  unsubCandidates?.(); unsubMyVotes?.();
  unsubCandidates = unsubMyVotes = null;
  clearInterval(dayWatcher);
  dayWatcher = null;
  CANDIDATES = [];
  MY_VOTES = [];
}

function startListening() {
  stopListening();          // 重複登入時不要留下舊的監聽

  unsubCandidates = onSnapshot(
    query(collection(db, 'candidates'), orderBy('voteCount', 'desc')),
    (snap) => {
      CANDIDATES = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
    },
    (err) => {
      $('cards').innerHTML = `<div class="empty">讀取候選名單失敗：${err.code || err.message}</div>`;
    }
  );

  unsubMyVotes = onSnapshot(
    query(collection(db, 'votes'), where('uid', '==', ME.id + '')),
    (snap) => {
      MY_VOTES = snap.docs.map((d) => ({
        candidateId: d.data().candidateId,
        day: d.data().day || 0,
      }));
      render();
    }
  );

  // 跨過台北時間 0:00 時自動換算新額度，不用叫使用者重新整理
  clearInterval(dayWatcher);
  dayWatcher = setInterval(() => {
    const now = taipeiDayInt();
    if (now !== TODAY) { TODAY = now; }
    render();          // 順便讓倒數文字每分鐘更新
  }, 30000);
}

function imageSrcOf(c) {
  return c.imageData || c.imageUrl || '';
}

function render() {
  // 保險：Firestore 的監聽有可能在登出後才把最後一筆事件送達，
  // 這時 ME 已經是 null，直接跳過不畫。
  if (!ME) return;

  const box = $('cards');

  // 額度只看「今天」投的票。票不能取消，所以用掉就是用掉了。
  const used = usedToday();
  const votesLeft = MAX_VOTES > 0 ? MAX_VOTES - used : Infinity;

  $('listSummary').textContent = MAX_VOTES > 0
    ? `目前 ${CANDIDATES.length} 位候選人 · 今天還剩 ${Math.max(0, votesLeft)} / ${MAX_VOTES} 票（${resetCountdown()}）`
    : `目前 ${CANDIDATES.length} 位候選人 · 你已投 ${MY_VOTES.length} 票`;

  const minesToday = CANDIDATES.filter(
    (c) => c.nominatorId === ME.id + '' && c.day === TODAY
  ).length;
  $('quotaHint').textContent = MAX_NOMS > 0
    ? `今天已提名 ${minesToday} / ${MAX_NOMS} 筆（${resetCountdown()}）`
    : '';

  if (!CANDIDATES.length) {
    box.innerHTML = '<div class="empty">還沒有人提名。<br>切到「我要提名」開第一槍吧。</div>';
    return;
  }

  box.innerHTML = '';
  CANDIDATES.forEach((c, i) => {
    const myCount = myVotesFor(c.id);
    const outOfVotes = votesLeft <= 0;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.position = 'relative';

    if (i < 3 && c.voteCount > 0) {
      const r = document.createElement('div');
      r.className = 'rank';
      r.textContent = `#${i + 1}`;
      card.append(r);
    }

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const src = imageSrcOf(c);
    if (src) thumb.style.backgroundImage = `url("${src.replace(/"/g, '%22')}")`;

    const body = document.createElement('div');
    body.className = 'body';

    const t = document.createElement('div');
    t.className = 'target';
    t.textContent = c.targetName;

    const a = document.createElement('div');
    a.className = 'animal';
    a.append(document.createTextNode('長得像 '));
    const strong = document.createElement('b');
    strong.textContent = c.animalZh;
    a.append(strong);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `由 ${c.nominatorName} 提名` +
      (myCount ? ` · 你投了 ${myCount} 票` : '');

    const foot = document.createElement('div');
    foot.className = 'foot';
    const cnt = document.createElement('div');
    cnt.className = 'count';
    cnt.textContent = c.voteCount;
    const unit = document.createElement('span');
    unit.textContent = ' 票';
    cnt.append(unit);

    const vb = document.createElement('button');
    vb.className = 'small ghost';
    vb.textContent = '投他一票';
    vb.style.marginLeft = 'auto';
    vb.disabled = !EVENT.votingOpen || outOfVotes;
    if (outOfVotes) vb.title = `今天的 ${MAX_VOTES} 票用完了，${resetCountdown()}`;
    vb.addEventListener('click', () => castVote(c, vb));

    foot.append(cnt, vb);

    if (c.nominatorId === ME.id + '' && c.voteCount === 0) {
      const del = document.createElement('button');
      del.className = 'ghost small';
      del.textContent = '撤回';
      del.style.borderColor = 'var(--line)';
      del.addEventListener('click', async () => {
        if (!confirm(`確定撤回「${c.targetName} 像 ${c.animalZh}」這筆提名？`)) return;
        try { await deleteDoc(doc(db, 'candidates', c.id)); }
        catch (err) { alert('撤回失敗：' + (err.code || err.message)); }
      });
      foot.append(del);
    }

    body.append(t, a, meta, foot);
    card.append(thumb, body);
    box.append(card);
  });
}

// 投票：一次 transaction 同時寫三份文件，缺一不可——
//   1. quotas/{我}_{今天}     used +1，規則保證只增不減、上限 10
//   2. votes/{我}_{今天}_{n}  n 必須等於上面加完的 used，所以一天最多 10 筆
//   3. candidates/{候選}      voteCount +1，規則會回查第 2 份確實指向這位候選人
// 這三條綁在一起，「每天 10 票」就是伺服器強制的，前端被改也沒用。
async function castVote(c, btn) {
  if (!EVENT.votingOpen) return;

  const day = taipeiDayInt();
  const quotaRef = doc(db, 'quotas', `${ME.id}_${day}`);
  const candRef = doc(db, 'candidates', c.id);

  btn.disabled = true;
  try {
    await runTransaction(db, async (tx) => {
      const quotaSnap = await tx.get(quotaRef);
      const candSnap = await tx.get(candRef);
      if (!candSnap.exists()) throw new Error('這筆提名已經被撤回了');

      const used = quotaSnap.exists() ? (quotaSnap.data().used || 0) : 0;
      if (MAX_VOTES > 0 && used >= MAX_VOTES) {
        const e = new Error('QUOTA_EXHAUSTED');
        e.code = 'quota-exhausted';
        throw e;
      }
      const seq = used + 1;

      if (quotaSnap.exists()) {
        tx.update(quotaRef, { used: seq });
      } else {
        tx.set(quotaRef, { uid: ME.id + '', day, used: seq });
      }

      tx.set(doc(db, 'votes', `${ME.id}_${day}_${seq}`), {
        uid: ME.id + '',
        day,                      // 額度歸哪一天，規則會驗證不能造假
        seq,
        candidateId: c.id,
        createdAt: serverTimestamp(),
      });

      tx.update(candRef, { voteCount: (candSnap.data().voteCount || 0) + 1 });
    });
  } catch (err) {
    const code = err.code || '';
    let text;
    if (code === 'quota-exhausted') {
      text = `今天的 ${MAX_VOTES} 票已經投完了，${resetCountdown()}。`;
    } else if (code.includes('permission-denied')) {
      // 額度用完（別的分頁投掉了）或剛好跨過午夜，都會落在這裡
      text = '投票被拒絕：可能是今天的票已投完，或剛好跨過午夜。請重新整理頁面確認。';
    } else {
      text = code || err.message;
    }
    alert('投票失敗：' + text);
  } finally {
    btn.disabled = false;
  }
}

// 中文 → 英文：先查內建表，查不到才用 MyMemory（免費、免 key）
async function toEnglish(zh) {
  const local = localTranslate(zh);
  if (local) return local;
  try {
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(zh) + '&langpair=zh-TW|en';
    const r = await fetch(url);
    const j = await r.json();
    const t = j?.responseData?.translatedText;
    if (t && !/^\s*$/.test(t) && !/NO QUERY|MYMEMORY WARNING/i.test(t)) {
      return t.toLowerCase().replace(/[^a-z\s'-]/g, '').trim();
    }
  } catch (_) { /* 翻譯掛掉就算了，下面直接用原字串試 */ }
  return zh;
}

async function pexelsSearch(en) {
  const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(en)}` +
              `&per_page=15&orientation=square`;
  const r = await fetch(url, { headers: { Authorization: PEXELS_API_KEY } });
  if (!r.ok) throw new Error(`Pexels 回應 ${r.status}`);
  const j = await r.json();
  return (j.photos || []).map((p) => ({
    url: p.src.large || p.src.medium,
    credit: `Photo by ${p.photographer} / Pexels`,
  }));
}

// ---------- 自行上傳 ----------
// 不用 Firebase Storage（新專案要付費方案），改成壓縮後直接存進 Firestore 文件。
// 800px / JPEG 0.8 大約 60–120KB，遠低於 1MB 的文件上限。
function compressImage(file, maxSide = 800, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.onload = () => { img.src = reader.result; };
    img.onerror = () => reject(new Error('這個檔案不是有效的圖片'));
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);

      let q = quality;
      let out = cv.toDataURL('image/jpeg', q);
      // 萬一還是太大（超過規則允許的 700KB）就再降畫質
      while (out.length > 650000 && q > 0.35) {
        q -= 0.12;
        out = cv.toDataURL('image/jpeg', q);
      }
      resolve(out);
    };
    reader.readAsDataURL(file);
  });
}

$('fileInput').addEventListener('change', async (e) => {

    picked = { imageData: dataUrl };
    showPreview(dataUrl, '你上傳的圖片');
    show(msg, `圖片已壓縮好（約 ${Math.round(dataUrl.length / 1024)} KB）。`, 'ok');
  } catch (err) {
    show(msg, err.message, 'err');
  }
  e.target.value = '';
});

function resolveTarget() {
  const found = resolveWho($('target').value);
  if (found.length === 1) return found[0];
  const exact = found.filter((p) => p.name.toLowerCase() === $('target').value.trim().toLowerCase());
  return exact.length === 1 ? exact[0] : null;
}

function updateSubmitState() {
  const t = resolveTarget();
  const ok = !!t && t.id !== ME?.id && !!picked && !!normalizeAnimal($('animal').value)
             && EVENT.votingOpen;
  $('submitBtn').disabled = !ok;

  const hint = $('targetHint');
  const raw = $('target').value.trim();
  if (!raw) hint.textContent = '不能提名自己喔';
  else if (!t) hint.textContent = '這個名字對不上名單，請從下拉選單挑一位。';
  else if (t.id === ME?.id) hint.textContent = '不能提名自己 😅 換一位同事吧。';
  else hint.textContent = `已選：${t.name}（${t.dept}）`;
}

$('animal').addEventListener('input', updateSubmitState);

const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9一-鿿]+/g, '-')
  .replace(/^-|-$/g, '').slice(0, 40);

$('submitBtn').addEventListener('click', async () => {
  const msg = $('nomMsg');
  hide(msg);
  const target = resolveTarget();
  const animalZh = normalizeAnimal($('animal').value);
  if (!target || !picked || !animalZh) return;

  const minesToday = CANDIDATES.filter(
    (c) => c.nominatorId === ME.id + '' && c.day === TODAY
  ).length;
  if (MAX_NOMS > 0 && minesToday >= MAX_NOMS) {
    return show(msg, `每人每天最多提名 ${MAX_NOMS} 筆，今天的額度用完了（${resetCountdown()}）。` +
                     `也可以到排行榜撤回今天的某一筆，額度會還給你。`, 'err');
  }

  // doc id 用「被提名人 + 動物」組成，天生擋掉重複提名同一組合
  const candidateId = `${target.id}_${slug(pickedAnimalEn || animalZh)}`;
  const btn = $('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 送出中';

  try {
    const ref = doc(db, 'candidates', candidateId);
    const existing = await getDoc(ref);
    if (existing.exists()) {
      const e = existing.data();
      show(msg, `${e.nominatorName} 已經提名過「${e.targetName} 像 ${e.animalZh}」了，` +
                `到排行榜投他一票就好。`, 'err');
      return;
    }

    await setDoc(ref, {
      nominatorId: ME.id + '',
      nominatorName: ME.name,
      targetId: target.id + '',
      targetName: target.name,
      targetDept: target.dept,
      animalZh,
      animalEn: pickedAnimalEn || '',
      ...picked,
      imageCredit: picked.imageUrl ? (searchResults[resultIdx]?.credit || '') : '使用者上傳',
      voteCount: 0,
      day: taipeiDayInt(),          // 算在哪一天的提名額度，規則會驗證
      createdAt: serverTimestamp(),
    });

    // 清空表單
    $('target').value = '';
    $('animal').value = '';
    $('preview').classList.remove('show');
    picked = null; searchResults = []; pickedAnimalEn = '';
    show(msg, '提名成功！切到「候選排行」看看。', 'ok');
  } catch (err) {
    const code = err.code || '';
    show(msg, '提名失敗：' + (code.includes('permission-denied')
      ? '剛好跨過午夜了，請重新整理頁面再送一次。' : (code || err.message)), 'err');
  } finally {
    btn.textContent = '送出提名';
    updateSubmitState();
  }
});

// ==================== 啟動 ====================
(async () => {
  $('loginTitle').textContent = EVENT.title;
  $('loginSub').textContent = EVENT.subtitle;
  document.title = EVENT.title;
  try {
    await loadRoster();
  } catch (err) {
    show($('loginMsg'), err.message, 'err');
    $('loginBtn').disabled = true;
  }
  if (!EVENT.votingOpen) {
    $('submitBtn').disabled = true;
  }
  // 走到這裡代表程式已經正常啟動，之後的錯誤都算「執行中出錯」而非載入失敗
  window.__booted = true;
})();
</script>
</body>
</html>
